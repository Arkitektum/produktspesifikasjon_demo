- Ugradert
price:
  priceAmount: 0
  priceUnit: dataset
description:
  limitations: Åpne data. Lisens. Ugradert
  purpose: Formålet er å kunne identifisere og vise hvor planarbeid er startet, slik
    at naboer, berørte parter, høringsmyndigheter og kommunen får informasjon om planinitiativet
    og kan medvirke i prosessen.
authoritativeDefinitions:
- url: https://kartkatalog.geonorge.no/metadata/779a554b-fc3e-48a6-b202-561b07e9d4c2
  type: businessDefinition
  description: Metadata i Kartkatalogen
team:
  members:
  - username: ftb@dibk.no
    name: Olaug Hana Nesheim
    description: Direktoratet for byggkvalitet
    role: owner, pointOfContact, publisher
support:
- channel: Direktoratet for byggkvalitet
  tool: email
  url: mailto:ftb@dibk.no
  scope: issues
  description: Kontaktpunkt hos Direktoratet for byggkvalitet
slaProperties:
- property: frequency
  value: Kontinuerlig
  driver: operational
  description: Kontinuerlig oppdatert
customProperties:
- property: license
  value: Norsk lisens for offentlige data (NLOD) 2.0
- property: licenseUrl
  value: https://data.norge.no/nlod/no/2.0
- property: accessConstraints
  value: Åpne data
- property: useConstraints
  value: Lisens
- property: classification
  value: Ugradert
- property: spatialRepresentationType
  value: Vektor
- property: language
  value: nor
- property: maintenanceAndUpdateStatement
  value: Kontinuerlig oppdatert
servers:
- server: ogc-api-features
  type: api
  location: https://plandata.ft.dibk.no/services/rest/planleggingigangsatt
  description: OGC API-Features - GeoJSON
- server: wms-tjeneste
  type: api
  location: https://plandata.ft.dibk.no/services/wms/planleggingigangsatt/?service=WMS&request=GetCapabilities
  description: WMS-tjeneste - PNG, BMP, GeoTIFF, JPEG, TIFF
schema:
- name: Arealplan
  physicalName: arealplan
  logicalType: object
  physicalType: table
  description: dataobjekt for igangsatt planlegging etter plan- og bygningsloven,
    slik det formidles i OGC API-Features fra Direktoratet for byggkvalitet
  customProperties:
  - property: sosiObjektType
    value: Arealplan
  - property: associations
    value:
    - role: planomrade
      target: Planområde
      cardinality: 0..*
  properties:
  - name: objid
    logicalType: string
    description: tjenestens interne identifikator for objektet (feature-id i OGC API)
    primaryKey: true
  - name: nasjonalArealplanId
    logicalType: object
    properties:
    - name: planid
      logicalType: string
      description: entydig identifikasjon av en plan innen vedkommende administrative
        enhet
    - name: kommunenummer
      logicalType: string
      authoritativeDefinitions:
      - url: https://register.geonorge.no/sosi-kodelister/inndelinger/inndelingsbase/kommunenummer
        type: businessDefinition
      customProperties:
      - property: sosiCodeList
        value: Kommunenummer
      - property: asDictionary
        value: 'true'
      description: kode som viser til offisiell nummerering av kommuner, alltid 4
        siffer med eventuell ledende null
    description: 'landsdekkende entydig og unik identifikasjon av en arealplan (pbl.
      §§ 6-4, 9-1 og 12-1, samt kart- og planforskriften § 9 andre og sjette ledd)


      Denne identifikatoren tildeles planen når planprosessen starter, og den kan
      ikke endres undervegs av forslagstiller'
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator av et objekt.


        Skal være en uuid, slik at den er unik, uavhengig av navnerommet'
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til et objekt.


        For plan anbefales navnerommet http://data.geonorge.no/sosi/plan'
    - name: versjonId
      logicalType: string
      description: identifikasjon av en spesiell versjon av et geografisk objekt (instans)
    description: 'unik identifikasjon av et objekt i et datasett, forvaltet av den
      ansvarlige produsent/forvalter, og kan benyttes av eksterne applikasjoner som
      stabil referanse til objektet.


      Merknad: Denne unike identifikatoren skal ikke endres i løpet av objektets levetid,
      og skal ikke gjenbrukes i andre objekt.'
  - name: plannavn
    logicalType: string
    description: planens offisielle navn
  - name: plantype
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/plan/reguleringsplanforslag/rpplantype
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: RpPlantype
    - property: asDictionary
      value: 'true'
    description: type reguleringsplan (pbl. §§ 12-2 og 12-3); angir om planen er en
      områderegulering eller detaljregulering
  - name: kunngjøringsdatoVarselOmPlanoppstart
    logicalType: date
    description: dato da varsel om oppstart av planarbeid ble kunngjort og sendt til
      berørte parter som naboer, sektormyndigheter og lag/foreninger med interesser
      i planen (pbl. § 12-8)
  - name: forslagsstillertype
    logicalType: string
    description: om forslagsstiller er privat eller offentlig planmyndighet
  - name: lovreferanse
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/plan/reguleringsplanforslag/lovreferanse
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Lovreferanse
    - property: asDictionary
      value: 'true'
    description: kode for hvilken lov planen vedtas etter. For planlegging igangsatt
      er lovreferanse = 6 (pbl. 2008)
  - name: forsteDigitaliseringsdato
    logicalType: timestamp
    description: dato når en representasjon av objektet i digital form første gang
      ble etablert
  - name: oppdateringsdato
    logicalType: timestamp
    description: tidspunkt for siste endring på dataobjektet
  - name: link
    logicalType: string
    description: lenke (URL) til nærmere informasjon om planen, for eksempel planinnsyn
      eller varselet om planoppstart
- name: Planområde
  physicalName: planomr_de
  logicalType: object
  physicalType: table
  description: 'område for planlegging igangsatt etter pbl. 2008, med tilhørende metadata
    fra varsel om oppstart av planarbeid, slik det formidles i OGC API-Features fra
    Direktoratet for byggkvalitet.


    Området skal være sammenhengende i grunnriss, men kan dekke flere vertikalnivåer.'
  customProperties:
  - property: sosiObjektType
    value: Planområde
  - property: associations
    value:
    - role: plan
      target: Arealplan
      cardinality: 0..1
  properties:
  - name: geometri
    logicalType: object
    physicalType: geometry(Surface)
    required: true
    customProperties:
    - property: geometryType
      value: Surface
  - name: objid
    logicalType: integer
    description: tjenestens interne identifikator for objektet (feature-id i OGC API)
    primaryKey: true
